# Activate with --spring.profiles.active=mysql
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:kindred}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:kindred}
spring.datasource.password=${DB_PASSWORD:kindred}

# No sample data with real users
kindred.seed-demo-data=${SEED_DEMO_DATA:false}

# Set these as environment variables. If they are missing, no admin is created.
kindred.admin.email=${ADMIN_EMAIL:}
kindred.admin.password=${ADMIN_PASSWORD:}
