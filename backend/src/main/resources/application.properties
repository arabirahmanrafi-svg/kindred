# ---------------------------------------------------------------
# Default (development) profile: in-memory H2 database with sample
# therapist profiles, so the app is usable immediately.
# Use the "mysql" profile for real data (application-mysql.properties).
# ---------------------------------------------------------------
spring.application.name=kindred
server.port=8080

spring.datasource.url=jdbc:h2:mem:kindred;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Load clearly-labeled sample therapists (never enable this in production)
kindred.seed-demo-data=true

# Admin account created at startup if it doesn't exist. DEVELOPMENT ONLY values.
kindred.admin.email=admin@kindred.local
kindred.admin.password=ChangeMe-DevOnly-2026

# How long a login lasts
kindred.session-days=7

# Origins allowed to call the API from another host (the Vite dev server).
kindred.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
